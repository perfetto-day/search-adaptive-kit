name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patcher-and-color-detector:
    name: Python / JavaScript / shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python patcher regression tests
        run: python3 tests/patcher.test.py
      - name: JavaScript color detector tests
        run: node tests/color-detector.test.js
      - name: Check shell syntax
        run: bash -n update-and-build.sh toggle-mode.command mod-update.command
      - name: Check Python syntax
        run: python3 -m py_compile apply_mod.py tests/patcher.test.py

  upstream-anchor-smoke:
    name: Patch Search 1323fdc (reported failure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Search at the reported upstream commit
        run: |
          git init "$RUNNER_TEMP/Search"
          git -C "$RUNNER_TEMP/Search" remote add origin https://github.com/driceroland/Search.git
          git -C "$RUNNER_TEMP/Search" fetch --depth 1 origin 1323fdccb8bb5e941dcdc473d3261fccada13538
          git -C "$RUNNER_TEMP/Search" checkout --detach FETCH_HEAD
      - name: Apply and reapply Search Adaptive patch
        run: |
          python3 apply_mod.py "$RUNNER_TEMP/Search"
          python3 apply_mod.py "$RUNNER_TEMP/Search"

  macos-build:
    name: macOS / Xcode native build
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check Xcode toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
      - name: Clone upstream Search
        run: git clone --depth 1 https://github.com/driceroland/Search.git "$RUNNER_TEMP/Search"
      - name: Apply Search Adaptive patch
        run: python3 apply_mod.py "$RUNNER_TEMP/Search"
      - name: Compile patched native macOS app
        working-directory: ${{ runner.temp }}/Search
        run: |
          set -o pipefail
          ./build.sh release app 2>&1 | tee "$RUNNER_TEMP/search-adaptive-build.log"
      - name: Upload compiler log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-compiler-log
          path: ${{ runner.temp }}/search-adaptive-build.log
          if-no-files-found: ignore
