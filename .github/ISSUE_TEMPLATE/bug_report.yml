name: Bug report
description: Report an adaptive color mismatch or build problem
title: "[Bug] "
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Prefer a public website or minimal HTML. Never share private pages or credentials.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "macOS / Xcode / upstream Search revision"
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Color source, hex, dimming and relevant compiler errors (redact sensitive info).
